
services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - employee_data:/app/instance
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  employee_data:
